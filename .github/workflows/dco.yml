# Every commit of a pull request needs a Signed-off-by line (CONTRIBUTING.md, DCO).
name: dco

on:
  pull_request:

permissions:
  contents: read

jobs:
  signoff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check sign-off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author=$(git log -1 --format='%an <%ae>' "$c")
            if ! git log -1 --format=%B "$c" | grep -qiF "Signed-off-by: $author"; then
              echo "::error::commit $(git log -1 --format='%h %s' "$c") has no 'Signed-off-by: $author'"
              missing=1
            fi
          done
          [ $missing -eq 0 ] && echo "all commits signed off"
          exit $missing
