# Builds the container images; called by ci.yml (edge builds) and release.yml (versions).
name: images

on:
  workflow_call:
    inputs:
      push:
        description: push to GHCR (false = build only)
        type: boolean
        default: false
      version:
        description: release version without "v" (empty = edge build of the branch)
        type: string
        default: ""
      platforms:
        type: string
        default: linux/amd64,linux/arm64

permissions:
  contents: read
  packages: write
  id-token: write # keyless cosign signatures

jobs:
  image:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: ingest, context: ., file: services/ingest/Dockerfile}
          - {name: controller, context: ., file: services/controller/Dockerfile}
          - {name: chat-gateway, context: ., file: services/chat-gateway/Dockerfile}
          - {name: web, context: ., file: services/web/Dockerfile}
          - {name: action-guard, context: services/action-guard, file: services/action-guard/Dockerfile}
          - {name: tool-hub, context: ., file: build/go.Dockerfile, cmd: services/tool-hub}
          - {name: k8s-agent, context: ., file: build/go.Dockerfile, cmd: agents/k8s-agent}
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ai-sre/${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }},enable=${{ inputs.version != '' && !contains(inputs.version, '-') }}
            type=raw,value=latest,enable=${{ inputs.version != '' && !contains(inputs.version, '-') }}
            type=raw,value=edge,enable=${{ inputs.version == '' && github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,enable=${{ inputs.version == '' }}
          labels: |
            org.opencontainers.image.title=ai-sre-${{ matrix.name }}
            org.opencontainers.image.description=Ventrolab AI SRE ${{ matrix.name }}
            org.opencontainers.image.licenses=Apache-2.0

      - uses: docker/setup-qemu-action@v3 # Python images build under emulation for arm64
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: inputs.push
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        id: build
        env:
          # No *.dockerbuild artifact per image; it only clutters the run (and the release).
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CMD=${{ matrix.cmd }}
            VERSION=${{ inputs.version || github.sha }}
          provenance: ${{ inputs.push && 'mode=max' || 'false' }}
          sbom: ${{ inputs.push }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - uses: sigstore/cosign-installer@v3
        if: inputs.push
      - name: Sign (keyless, GitHub OIDC)
        if: inputs.push
        run: cosign sign --yes "${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}"
