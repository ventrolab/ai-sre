<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in - Ventrolab AI SRE</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="login-wrap">
  <div class="card login">
    <div class="brand"><img src="/static/icon.svg" alt="" class="logo"><div>Ventrolab AI SRE</div></div>
    <p class="muted small">Sign in to the administration console.</p>
    {% if error %}<div class="alert bad">{{ error }}</div>{% endif %}
    {% if cfg.oidc_enabled %}
      <a class="btn primary block" href="/auth/oidc/login?next={{ next | urlencode }}">Sign in with {{ cfg.oidc_name }}</a>
    {% endif %}
    {% if cfg.local_auth %}
      {% if cfg.oidc_enabled %}<div class="sep">or with a local account</div>{% endif %}
      <form method="post" action="/login">
        <input type="hidden" name="csrf" value="{{ csrf }}">
        <input type="hidden" name="next" value="{{ next }}">
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" required style="width:100%" autofocus>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required style="width:100%">
        <div style="margin-top:16px"><button class="btn {{ '' if cfg.oidc_enabled else 'primary' }} block" type="submit">Sign in</button></div>
      </form>
    {% endif %}
  </div>
</div>
</body>
</html>
