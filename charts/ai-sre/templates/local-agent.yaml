{{- if and .Values.toolHub.enabled .Values.localAgent.enabled }}
{{- $name := printf "%s-local-agent" .Release.Name -}}
{{- $la := .Values.localAgent -}}
{{- $mtls := eq .Values.toolHub.tunnel.auth "mtls" -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels: {{- include "aisre.labels" . | nindent 4 }}
---
# Read-only: every resource except Secrets, plus pod logs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}
  labels: {{- include "aisre.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, services, endpoints, events, nodes, namespaces, configmaps, persistentvolumes,
                persistentvolumeclaims, replicationcontrollers, resourcequotas, limitranges, serviceaccounts]
    verbs: [get, list, watch]
  - apiGroups: [apps, batch, autoscaling, policy, networking.k8s.io, storage.k8s.io, discovery.k8s.io,
                events.k8s.io, coordination.k8s.io, apiextensions.k8s.io, metrics.k8s.io, rbac.authorization.k8s.io]
    resources: ["*"]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}
  labels: {{- include "aisre.labels" . | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ $name }}}
subjects:
  - {kind: ServiceAccount, name: {{ $name }}, namespace: {{ .Release.Namespace }}}
{{- if $la.write.enabled }}
---
# Write primitives for the Action Guard (playbook actions).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}-write
  labels: {{- include "aisre.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [delete]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [patch]
  - apiGroups: [apps]
    resources: [deployments, deployments/scale]
    verbs: [patch, update]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}-write
  labels: {{- include "aisre.labels" . | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ $name }}-write}
subjects:
  - {kind: ServiceAccount, name: {{ $name }}, namespace: {{ .Release.Namespace }}}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels: {{- include "aisre.labels" . | nindent 4 }}
data:
  agent.yaml: |
    hubURL: wss://{{ .Release.Name }}-tool-hub:8443/v1/tunnel
    labels: {{- toYaml (merge (dict "cluster" .Values.clusterName "local" "true") $la.labels) | nindent 6 }}
    {{- if $mtls }}
    auth: mtls
    tls:
      ca: /etc/ai-sre/tls/ca.crt
      cert: /etc/ai-sre/tls/tls.crt
      key: /etc/ai-sre/tls/tls.key
    {{- else }}
    auth: token
    tokenFile: /etc/ai-sre/token/token
    tls:
      ca: /etc/ai-sre/tls/ca.crt
    {{- end }}
    prometheus: {{- toYaml $la.prometheus | nindent 6 }}
    logBackends: {{- toYaml $la.logBackends | nindent 6 }}
    write:
      enabled: {{ $la.write.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels: {{- include "aisre.labels" . | nindent 4 }}
    app.kubernetes.io/name: local-agent
spec:
  replicas: 1
  # One connection per agent name: a rolling update would let the old and the new pod
  # replace each other's tunnel until the old one stops.
  strategy: {type: Recreate}
  selector:
    matchLabels: {{- include "aisre.selector" (dict "root" . "name" "local-agent") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "aisre.selector" (dict "root" . "name" "local-agent") | nindent 8 }}
      annotations:
        checksum/config: {{ print (toYaml $la) .Values.toolHub.tunnel.auth | sha256sum }}
    spec:
      serviceAccountName: {{ $name }}
      enableServiceLinks: false
      {{- include "aisre.scheduling" $ | nindent 6 }}
      containers:
        - name: agent
          image: {{ include "aisre.image" (dict "root" . "name" "k8s-agent") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [-config, /etc/ai-sre/agent.yaml]
          ports:
            - {name: health, containerPort: 8081}
          readinessProbe:
            httpGet: {path: /readyz, port: health}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: health}
            periodSeconds: 30
          resources: {{- toYaml $la.resources | nindent 12 }}
          securityContext: {{- include "aisre.securityContext" . | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /etc/ai-sre/agent.yaml, subPath: agent.yaml, readOnly: true}
            - {name: tls, mountPath: /etc/ai-sre/tls, readOnly: true}
            {{- if not $mtls }}
            - {name: token, mountPath: /etc/ai-sre/token, readOnly: true}
            {{- end }}
      volumes:
        - name: config
          configMap: {name: {{ $name }}}
        {{- if $mtls }}
        - name: tls
          secret: {secretName: {{ .Release.Name }}-local-agent-tls}
        {{- else }}
        # The hub CA verifies the hub's TLS port; the token authenticates the agent.
        - name: tls
          secret:
            secretName: {{ .Release.Name }}-tool-hub-tls
            items: [{key: ca.crt, path: ca.crt}]
        - name: token
          secret: {secretName: {{ .Release.Name }}-local-agent-token}
        {{- end }}
{{- end }}
