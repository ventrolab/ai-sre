{{- $name := printf "%s-ingest" .Release.Name -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels: {{- include "aisre.labels" . | nindent 4 }}
    app.kubernetes.io/name: ingest
spec:
  replicas: {{ .Values.ingest.replicas }}
  selector:
    matchLabels: {{- include "aisre.selector" (dict "root" . "name" "ingest") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "aisre.selector" (dict "root" . "name" "ingest") | nindent 8 }}
    spec:
      enableServiceLinks: false
      {{- include "aisre.scheduling" $ | nindent 6 }}
      containers:
        - name: ingest
          image: {{ include "aisre.image" (dict "root" . "name" "ingest") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - {name: NATS_URL, value: {{ include "aisre.natsUrl" . | quote }}}
            - {name: CLUSTER_NAME, value: {{ .Values.clusterName | quote }}}
            - name: INGEST_TOKEN
              valueFrom:
                secretKeyRef: {name: {{ .Release.Name }}-secrets, key: INGEST_TOKEN}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 30
          resources: {{- toYaml .Values.ingest.resources | nindent 12 }}
          securityContext: {{- include "aisre.securityContext" . | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {{- include "aisre.labels" . | nindent 4 }}
spec:
  selector: {{- include "aisre.selector" (dict "root" . "name" "ingest") | nindent 4 }}
  ports:
    - {name: http, port: 8080, targetPort: http}
