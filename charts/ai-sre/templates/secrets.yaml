{{- $secret := printf "%s-secrets" .Release.Name -}}
{{- $litellmKey := include "aisre.secretValue" (dict "root" . "secret" $secret "key" "LITELLM_MASTER_KEY") -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secret }}
  labels: {{- include "aisre.labels" . | nindent 4 }}
type: Opaque
stringData:
  LITELLM_MASTER_KEY: {{ $litellmKey | quote }}
  INGEST_TOKEN: {{ include "aisre.secretValue" (dict "root" . "secret" $secret "key" "INGEST_TOKEN") | quote }}
  POSTGRES_PASSWORD: {{ include "aisre.secretValue" (dict "root" . "secret" $secret "key" "POSTGRES_PASSWORD") | quote }}
---
# Only the LLM gateway key, for HolmesGPT.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-llm-client
  labels: {{- include "aisre.labels" . | nindent 4 }}
type: Opaque
stringData:
  LITELLM_API_KEY: {{ $litellmKey | quote }}
