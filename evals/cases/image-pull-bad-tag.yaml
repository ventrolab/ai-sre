name: image-pull-bad-tag
description: The deployment references an image tag that does not exist.
namespace: payments
steps:
  - apply: |
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: payments-gateway}
      spec:
        replicas: 1
        selector: {matchLabels: {app: payments-gateway}}
        template:
          metadata: {labels: {app: payments-gateway}}
          spec:
            containers:
              - name: gateway
                image: busybox:1.36.99-nonexistent
                command: [sleep, "3600"]
                resources: {requests: {cpu: 5m, memory: 8Mi}, limits: {memory: 32Mi}}
    wait: {selector: app=payments-gateway, reasons: [ImagePullBackOff, ErrImagePull]}
alert:
  alertname: KubePodNotReady
  labels: {severity: warning}
  summary: Pod {namespace}/{pod} has been in a non-ready state for longer than 15 minutes.
expect:
  root_cause: [[image, pull], [1.36.99-nonexistent, tag, not found, manifest, does not exist]]
  playbook: null
  min_confidence: 0.7
