name: missing-secret
description: An environment variable references a Secret that does not exist.
namespace: auth
steps:
  - apply: |
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: auth-service}
      spec:
        replicas: 1
        selector: {matchLabels: {app: auth-service}}
        template:
          metadata: {labels: {app: auth-service}}
          spec:
            containers:
              - name: auth
                image: busybox:1.36.1
                command: [sleep, "3600"]
                env:
                  - name: JWT_SIGNING_KEY
                    valueFrom: {secretKeyRef: {name: auth-jwt-keys, key: signing-key}}
                resources: {requests: {cpu: 5m, memory: 8Mi}, limits: {memory: 32Mi}}
    wait: {selector: app=auth-service, reasons: [CreateContainerConfigError]}
alert:
  alertname: KubePodNotReady
  labels: {severity: warning}
  summary: Pod {namespace}/{pod} has been in a non-ready state for longer than 15 minutes.
expect:
  root_cause: [[secret], [auth-jwt-keys]]
  playbook: null
  min_confidence: 0.7
